[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "squint-rl"
version = "0.1.0"
description = "A detector-neutral Gymnasium benchmark for compute-budgeted tracking-by-detection."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "gymnasium>=1.3,<2",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "trackeval>=1.3,<2",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
reference = [
    "nvidia-ml-py>=13,<14",
    "pillow>=11,<13",
    "safetensors>=0.6,<1",
    "torch==2.11.0",
    "trackers==2.6.0",
    "transformers==4.57.6",
]
research = [
    "stable-baselines3==2.9.0",
    "torch==2.11.0",
]

[project.scripts]
squint = "squint_rl.cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/squint_rl"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
    "/src/squint_rl",
    "/tests",
    "/examples",
    "/research",
    "/docs/superpowers/specs/2026-08-08-squint-m0-design.md",
    "/docs/superpowers/plans/2026-08-08-squint-m0.md",
]

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "hypothesis>=6,<7",
    "mypy>=1.17,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: opt-in tests that load external model artifacts",
]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
